<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Rajarshi's AI Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; color: var(--ink); }
        .admin-shell { padding: 40px 8%; }
        .admin-container { max-width: 700px; margin: 0 auto; background: var(--surface-strong); padding: 30px; border-radius: 8px; border: 1px solid var(--line); box-shadow: var(--shadow); }
        h2 { margin-bottom: 20px; color: var(--cyan); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--muted); }
        input, textarea { width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 1rem; }
        input:focus, textarea:focus { border-color: var(--cyan); outline: none; }
        textarea { height: 120px; font-family: inherit; }
        .code-textarea { font-family: 'Courier New', monospace; height: 180px; color: var(--green); }
        .btn-submit { background: linear-gradient(135deg, var(--cyan), var(--green)); color: #061018; border: none; padding: 14px; border-radius: 8px; font-weight: 800; width: 100%; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .output-box { margin-top: 30px; display: none; }
        .output-box pre { background: var(--code-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--line); overflow-x: auto; font-family: monospace; white-space: pre-wrap; color: var(--code-text); }
    </style>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="index.html" aria-label="Rajarshi's AI Academy home">
            <span class="logo-mark">AI</span>
            <span>Admin Portal</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Lab</a>
            <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☾</span>
            </button>
        </nav>
    </header>

    <div class="admin-shell">
        <div class="admin-container">
            <h2>Add Daily Tutorial Topic</h2>
            <form id="admin-form">
                <div class="form-group">
                    <label for="topic-id">Unique Day ID (e.g., day-3)</label>
                    <input type="text" id="topic-id" placeholder="day-3" required>
                </div>
                <div class="form-group">
                    <label for="topic-title">Topic Title</label>
                    <input type="text" id="topic-title" placeholder="Day 3: Control Flow and Loops" required>
                </div>
                <div class="form-group">
                    <label for="description">Topic Description Summary</label>
                    <textarea id="description" placeholder="Write a short summary for your students..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="objectives">What students will learn</label>
                    <textarea id="objectives" placeholder="One objective per line..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="key-points">Key ideas</label>
                    <textarea id="key-points" placeholder="One key idea per line..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="note">Lesson note</label>
                    <textarea id="note" placeholder="Add a helpful reminder for students..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="code-snippet">Python Code Snippet</label>
                    <textarea id="code-snippet" class="code-textarea" placeholder="# Paste your Python code here..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Generate Topic Data Block</button>
            </form>

            <div id="output-section" class="output-box">
                <label style="color: var(--cyan);">Generated Code Data Block:</label>
                <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 10px;">Copy this block and paste it directly into your <code>js/course-data.js</code> file array.</p>
                <pre><code id="json-output"></code></pre>
                <button onclick="copyToClipboard()" class="btn-submit" style="margin-top: 10px; width: auto; padding: 8px 15px;">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
